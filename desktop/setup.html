<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Setting up HAVOC</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root { --bg:#0c0d10; --panel:#121419; --line:rgba(255,255,255,.07); --text:#e8eaef; --muted:#8a909c; --accent:#5cb4d9; --bad:#e06a70; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Segoe UI Variable","Segoe UI",system-ui,sans-serif; }
  main { height:100%; display:grid; grid-template-rows:auto 1fr auto; gap:14px; padding:28px 32px; box-sizing:border-box; }
  h1 { margin:0; font-size:20px; letter-spacing:-.01em; }
  p { margin:4px 0 0; color:var(--muted); }
  pre { margin:0; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
        font:12.5px/1.55 ui-monospace,"Cascadia Mono",Consolas,monospace; color:#b7bcc7; white-space:pre-wrap; }
  .bad { color:var(--bad); }
  .step { color:var(--accent); }
  footer { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:13px; }
  button { border:0; border-radius:12px; padding:10px 18px; background:var(--accent); color:var(--bg); font-weight:600; cursor:pointer; }
  button:active { transform:scale(.98); }
</style></head>
<body><main>
  <header>
    <h1>Setting up HAVOC</h1>
    <p>One-time install: Python, Ollama and the AI model (about 6 GB, so this is a good moment for chai). Nothing here touches your accounts yet.</p>
  </header>
  <pre id="log" aria-live="polite"></pre>
  <footer><span id="status">Working...</span><button id="retry" hidden>Retry</button></footer>
</main>
<script>
  const log = document.getElementById("log");
  const add = (line) => {
    const span = document.createElement("span");
    span.textContent = line + "\n";
    if (line.startsWith("!")) span.className = "bad";
    else if (line.startsWith(">>")) span.className = "step";
    log.appendChild(span);
    log.scrollTop = log.scrollHeight;
  };
  window.havocDesktop.onSetupLog(add);
  window.havocDesktop.onSetupFailed(() => {
    document.getElementById("status").textContent = "Setup stopped.";
    document.getElementById("retry").hidden = false;
  });
  document.getElementById("retry").onclick = () => window.havocDesktop.retrySetup();
</script>
</body></html>

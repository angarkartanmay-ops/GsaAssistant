# Builds the HAVOC desktop installer (.exe) and phone app (.apk). Run it from the Actions tab
# ("Run workflow") or by pushing a tag like v1.0.1. Download the files from the run's Artifacts.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: UI
        working-directory: ui
        run: npm ci && npm run build
      - name: WhatsApp bridge dependencies
        working-directory: whatsapp-bridge
        run: npm ci --omit=dev
      - name: Installer + portable exe
        working-directory: desktop
        run: npm ci && npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: HAVOC-windows
          path: |
            desktop/dist/*.exe

  android:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HAVOC-android
          path: android/app/build/outputs/apk/release/app-release.apk
